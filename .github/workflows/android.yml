name: Android CI

on:
  push:
    branches: [ "main", "ci" ]

jobs:
  build:

    runs-on: ubuntu-26.04

    services:
      ghost:
        image: ghost:2-alpine
        ports:
          - 2368:2368

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Setup Ghost
      run: |
        curl -vvvv --fail \
          -d 'setup[0][name]=User' \
          -d 'setup[0][email]=user@example.com' \
          -d 'setup[0][password]=randomtestpwd' \
          -d 'setup[0][blogTitle]=My Blog' \
          http://localhost:2368/ghost/api/v0.1/authentication/setup/

    - name: Run tests
      run: ./gradlew testDebug -PdisablePreDex --console=plain

    - name : Retrieve Version
      run: |
        echo "VERSION_NAME=$(grep -rnwe versionName ${{github.workspace}}/app/build.gradle | awk '{print($3)}' | tr -d \')" >> $GITHUB_OUTPUT
      id: android_version

    - name: Get version
      run: |
        echo "version_name=${{steps.android_version.outputs.VERSION_NAME}}" >> $GITHUB_ENV

    - name: Archive debug artifact
      uses: actions/upload-artifact@v4
      with:
        name: "Ghost-Android-${{env.version_name}}"
        path: |
          app/build/outputs/apk/debug/app-debug.apk

    - name: Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        files: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish APK
      env:
       VERSION: ${{ env.version_name }}
      run: ./publish.sh

  emulator-smoke:
    # Launches the app on the newest Android emulator and fails on crash; uploads a screenshot.
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v4
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Prepare local Maven repo
      run: chmod +x gradlew && ./gradlew assembleDebug
    - name: Run app in emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        target: default
        arch: x86_64
        script: |
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c
          adb shell monkey -p org.ghost.android -c android.intent.category.LAUNCHER 1
          for i in $(seq 60); do adb logcat -d -s ActivityTaskManager:I | grep -q -E "Displayed org.ghost.android/.*(LoginActivity|PostListActivity)" && break; sleep 5; done
          sleep 10
          adb logcat -d > logcat.txt
          adb exec-out screencap -p > screenshot.png
          adb shell pidof org.ghost.android
          ! grep -A3 "FATAL EXCEPTION" logcat.txt | grep -q "Process: org.ghost.android"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: emulator-smoke
        path: |
          screenshot.png
          logcat.txt
