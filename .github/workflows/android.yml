name: Android CI

on: push

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      ghost:
        image: ghost:2-alpine
        ports:
          - 2368:2368

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: cp -r .m2 $HOME/ && ./gradlew assembleDebug

    - name: Setup Ghost
      run: |
        curl -vvvv --fail \
          -d 'setup[0][name]=User' \
          -d 'setup[0][email]=user@example.com' \
          -d 'setup[0][password]=randomtestpwd' \
          -d 'setup[0][blogTitle]=My Blog' \
          http://localhost:2368/ghost/api/v0.1/authentication/setup/

    - name: Run tests
      run: ./gradlew testDebug -PdisablePreDex --console=plain

    - name: Archive debug artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-build
        path: |
          app/build/outputs/apk/debug/app-debug.apk
