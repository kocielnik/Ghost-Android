name: Android CI

on:
  push:
    branches: [ "main", "ci" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      ghost:
        image: ghost:2-alpine
        ports:
          - 2368:2368

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: cp -r .m2 $HOME/ && ./gradlew assembleDebug

    - name: Setup Ghost
      run: |
        curl -vvvv --fail \
          -d 'setup[0][name]=User' \
          -d 'setup[0][email]=user@example.com' \
          -d 'setup[0][password]=randomtestpwd' \
          -d 'setup[0][blogTitle]=My Blog' \
          http://localhost:2368/ghost/api/v0.1/authentication/setup/

    - name: Run tests
      run: ./gradlew testDebug -PdisablePreDex --console=plain

    - name : Retrieve Version
      run: |
        echo "VERSION_NAME=$(grep -rnwe versionName ${{github.workspace}}/app/build.gradle | awk '{print($3)}' | tr -d \')" >> $GITHUB_OUTPUT
      id: android_version

    - name: Get version
      run: |
        echo "version_name=${{steps.android_version.outputs.VERSION_NAME}}" >> $GITHUB_ENV

    - name: Archive debug artifact
      uses: actions/upload-artifact@v4
      with:
        name: "Ghost-Android-${{env.version_name}}"
        path: |
          app/build/outputs/apk/debug/app-debug.apk

    - name: Publish APK
      env:
       GITHUB_TOKEN: ${{ secrets.TOKEN }}
       APP_FOLDER: app/build/outputs/apk/debug/app-debug.apk
       RELEASE_TITLE: "Ghost-Android-${{env.version_name}}"
      run: |
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/kocielnik/Ghost-Android/releases \
          -d '{"tag_name":"v1.0.0","target_commitish":"ci","name":"v1.0.0","body":"Description of the release","draft":false,"prerelease":false,"generate_release_notes":false}'
